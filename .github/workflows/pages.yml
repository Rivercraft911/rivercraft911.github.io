name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
      # deep links (/<project>) are routed by the app: serve it for every path
      - run: cp dist/index.html dist/404.html
      # /next/: the world branch while it is being made, built under its own base
      - id: next
        run: git ls-remote --exit-code --heads origin world && echo ok=1 >> "$GITHUB_OUTPUT" || true
      - if: steps.next.outputs.ok
        uses: actions/checkout@v4
        with:
          ref: world
          path: next
      - if: steps.next.outputs.ok
        working-directory: next
        run: npm ci && npx tsc --noEmit && npx vite build --base=/next/ --outDir ../dist/next --emptyOutDir
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
